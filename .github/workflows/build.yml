name: Build & Release APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/STM-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/STM-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STM-apks-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" dist/STM-debug.apk dist/STM-release-unsigned.apk \
            --title "STM $TAG ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --generate-notes
